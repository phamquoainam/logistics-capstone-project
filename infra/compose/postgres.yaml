name: elogistics-d1
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    container_name: elogistics-d1-postgres18
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: elogistics_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap_password
    secrets:
      - bootstrap_password
      - migrator_password
      - runtime_password
    volumes:
      - pg18_dev_data:/var/lib/postgresql
      - ../postgres/bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
      - ../postgres/bootstrap.sql:/opt/elogistics/bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elogistics_bootstrap -d elogistics_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
secrets:
  bootstrap_password:
    file: ${ELOGISTICS_SECRETS_DIR:?Run infra/postgres/start-local.ps1}/bootstrap-password.txt
  migrator_password:
    file: ${ELOGISTICS_SECRETS_DIR:?Run infra/postgres/start-local.ps1}/migrator-password.txt
  runtime_password:
    file: ${ELOGISTICS_SECRETS_DIR:?Run infra/postgres/start-local.ps1}/runtime-password.txt
volumes:
  pg18_dev_data:
    name: elogistics_d1_pg18_dev_data
