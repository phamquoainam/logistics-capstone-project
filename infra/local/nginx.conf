events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate /run/web/web.crt;
        ssl_certificate_key /run/web/web.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        client_max_body_size 12m;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        location /api/ {
            proxy_pass https://backend:8443;
            # Preserve the exact no-store response contract, without duplicate headers.
            proxy_hide_header Cache-Control;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_ssl_server_name on;
            proxy_ssl_name backend;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /run/web/ca.crt;
            proxy_ssl_verify_depth 2;
        }
        location /actuator/ { return 404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
