server.address=127.0.0.1
spring.autoconfigure.exclude=
server.port=${DEMO_PORT:8080}
spring.datasource.url=${DEMO_DB_URL}
spring.datasource.username=${DEMO_DB_USER}
spring.datasource.password=${DEMO_DB_PASSWORD}
spring.flyway.locations=classpath:db/demo-migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
demo.token-secret=${DEMO_TOKEN_SECRET}
demo.seed.enabled=${DEMO_SEED_ENABLED:false}
demo.seed.admin-password=${DEMO_ADMIN_PASSWORD:}
demo.seed.merchant-a-password=${DEMO_MERCHANT_A_PASSWORD:}
demo.seed.merchant-b-password=${DEMO_MERCHANT_B_PASSWORD:}
demo.seed.operator-password=${DEMO_OPERATOR_PASSWORD:}
demo.seed.disabled-password=${DEMO_DISABLED_PASSWORD:}
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
# Same-port status-only probes; the security chain permits only these two GETs.
management.endpoint.health.access=read-only
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.show-details=never
management.endpoint.health.group.liveness.show-components=never
management.endpoint.health.group.readiness.show-details=never
management.endpoint.health.group.readiness.show-components=never
management.endpoint.health.validate-group-membership=true
# Bound pool acquisition/validation; do not change pool size or startup policy.
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
