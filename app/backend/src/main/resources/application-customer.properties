# Explicit approved sandbox only; secret/configtree values must be supplied externally.
# Enable identity,customer,postgres after the controlled migration job has applied V11.
customer.rollout=${CUSTOMER_ROLLOUT}
customer.security.origin=${CUSTOMER_SECURITY_ORIGIN}
customer.security.issuer=${CUSTOMER_SECURITY_ISSUER}
customer.security.audience=${CUSTOMER_SECURITY_AUDIENCE}
customer.security.current-kid=${CUSTOMER_SECURITY_CURRENT_KID}
customer.security.jwk-set=${CUSTOMER_SECURITY_JWK_SET}
customer.security.limiter-hmac=${CUSTOMER_SECURITY_LIMITER_HMAC}
customer.security.proof-verifier-keys=${CUSTOMER_SECURITY_PROOF_VERIFIER_KEYS}
customer.security.delivery-encryption-keys=${CUSTOMER_SECURITY_DELIVERY_ENCRYPTION_KEYS}
customer.security.current-proof-key=${CUSTOMER_SECURITY_CURRENT_PROOF_KEY}
customer.security.current-encryption-key=${CUSTOMER_SECURITY_CURRENT_ENCRYPTION_KEY}
merchant.customer-profile.receipt-keys=${MERCHANT_CUSTOMER_PROFILE_RECEIPT_KEYS}
merchant.customer-profile.current-receipt-key=${MERCHANT_CUSTOMER_PROFILE_CURRENT_RECEIPT_KEY}
customer.smtp.mode=${CUSTOMER_SMTP_MODE}
customer.smtp.host=${CUSTOMER_SMTP_HOST}
customer.smtp.port=${CUSTOMER_SMTP_PORT}
customer.smtp.username=${CUSTOMER_SMTP_USERNAME:}
customer.smtp.password=${CUSTOMER_SMTP_PASSWORD:}
customer.smtp.sender=${CUSTOMER_SMTP_SENDER}
customer.smtp.approved-sender-domains=${CUSTOMER_SMTP_APPROVED_SENDER_DOMAINS}
public.media.mode=${PUBLIC_MEDIA_MODE:local}
public.media.local-root=${PUBLIC_MEDIA_LOCAL_ROOT:../frontend/web/public/media}
public.media.s3-region=${PUBLIC_MEDIA_S3_REGION:}
public.media.s3-bucket=${PUBLIC_MEDIA_S3_BUCKET:}
server.address=${CUSTOMER_BIND_ADDRESS}
server.port=${CUSTOMER_HTTPS_PORT}
server.ssl.enabled=true
server.ssl.key-store=${CUSTOMER_HTTPS_KEY_STORE}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${CUSTOMER_HTTPS_KEY_STORE_PASSWORD}
server.forward-headers-strategy=none
