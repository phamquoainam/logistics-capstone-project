# Activate demo,postgres in that order: shared demo behavior, PostgreSQL configuration last.
spring.autoconfigure.exclude=${foundation.client-exclusions}
spring.datasource.url=${PG_DB_URL}
spring.datasource.username=${PG_RUNTIME_USER}
spring.datasource.password=${PG_RUNTIME_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=${PG_MIGRATION_ENABLED:true}
spring.flyway.url=${PG_DB_URL}
spring.flyway.user=${PG_MIGRATOR_USER}
spring.flyway.password=${PG_MIGRATOR_PASSWORD}
spring.flyway.init-sqls=SET ROLE ${PG_OWNER_ROLE}
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=platform
spring.flyway.schemas=platform
spring.flyway.create-schemas=false
spring.flyway.table=flyway_schema_history
spring.flyway.placeholders.runtimeRole=${PG_RUNTIME_USER}
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.sql.init.mode=never
# PostgreSQL connect timeout bounds new physical connections, not business reads.
# Readiness uses JDBC isValid(1); no JDBC-wide socket read deadline is imposed.
spring.datasource.hikari.data-source-properties.connectTimeout=2
