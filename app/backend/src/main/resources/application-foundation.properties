# Explicit opt-in only: --spring.profiles.active=demo,postgres,foundation
foundation.client-exclusions=org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
management.endpoint.health.group.readiness.include=readinessState,db,redis,rabbit
spring.data.redis.host=127.0.0.1
spring.data.redis.port=${FOUNDATION_REDIS_PORT:6380}
spring.data.redis.username=${FOUNDATION_REDIS_USER}
spring.data.redis.password=${FOUNDATION_REDIS_PASSWORD}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=${FOUNDATION_RABBIT_PORT:5673}
spring.rabbitmq.username=${FOUNDATION_RABBIT_USER}
spring.rabbitmq.password=${FOUNDATION_RABBIT_PASSWORD}
spring.rabbitmq.virtual-host=/elogistics-foundation
spring.rabbitmq.connection-timeout=2s
spring.rabbitmq.requested-heartbeat=10s
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
