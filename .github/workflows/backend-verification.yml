name: Backend verification

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: architecture
            name: Architecture gate
          - mode: h2
            name: Backend default / H2
          - mode: postgres
            name: Backend PostgreSQL 18
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pinned contract Node
        if: matrix.mode == 'architecture' || matrix.mode == 'postgres'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # official v6 commit
        with:
          node-version: '24.13.0'
          check-latest: false
          package-manager-cache: false
      - name: Verify accepted Identity contract
        if: matrix.mode == 'architecture'
        run: |
          npm --prefix packages/api-client ci --ignore-scripts --no-audit --no-fund
          node contracts/identity-access/validate.mjs
          node packages/api-client/node_modules/@redocly/cli/bin/cli.js lint contracts/openapi/identity-access.yaml --config contracts/identity-access/redocly.yaml
      - name: Setup Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          check-latest: false
          verify-signature: true
          cache-jdk: false
          overwrite-settings: false
          problem-matcher: false
      - name: Record resolved Java version
        run: java -version
      - name: Build and verify Spec003 browser client
        if: matrix.mode == 'postgres'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/spec003-owned-browsers
        run: |
          npm --prefix packages/api-client ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/api-client run build
          npm --prefix app/frontend/web ci --ignore-scripts --no-audit --no-fund
          npm --prefix app/frontend/web run typecheck
          npm --prefix app/frontend/web run lint
          npm --prefix app/frontend/web run test
          npm --prefix app/frontend/web run build
          npm --prefix app/frontend/web run build:customer
          cd app/frontend/web
          npx --no-install playwright install --with-deps chromium
      - name: Test fail-closed report guard
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Prepare disposable PostgreSQL 18
        if: matrix.mode == 'postgres'
        run: python3 -B scripts/ci/prepare-postgres.py start --directory "$RUNNER_TEMP/d1-05-postgres"
      - name: Clean Maven Wrapper verify and test discovery audit
        env:
          VERIFICATION_MODE: ${{ matrix.mode }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/spec003-owned-browsers
        run: bash scripts/ci/run-backend.sh "$VERIFICATION_MODE"
      - name: Upload sanitized test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ matrix.mode }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/d1-05-reports/summary.json
            ${{ runner.temp }}/d1-05-reports/tests.xml
            ${{ runner.temp }}/d1-05-reports/customer-browser-results.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
      - name: Clean up only owned temporary PostgreSQL container
        if: always() && matrix.mode == 'postgres'
        run: python3 -B scripts/ci/prepare-postgres.py cleanup --directory "$RUNNER_TEMP/d1-05-postgres"
