  "x-identity-policy": {
    "accessSeconds": 900,
    "absoluteSeconds": 28800,
    "idleSeconds": 1800,
    "invitationSeconds": 86400,
    "recoverySeconds": 900,
    "refreshReplay": "REVOKE_FAMILY_NO_GRACE",
    "idleExcluded": [
      "refresh",
      "csrf",
      "health",
      "auth/me"
    ],
    "usernameCanonicalization": "IDENTITY_EXACT_NO_TRANSFORM",
    "jwtClaims": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "iss": {
          "type": "string",
          "minLength": 1
        },
        "aud": {
          "type": "string",
          "minLength": 1
        },
        "sub": {
          "type": "string",
          "format": "uuid"
        },
        "jti": {
          "type": "string",
          "format": "uuid"
        },
        "sid": {
          "type": "string",
          "format": "uuid"
        },
        "iat": {
          "type": "integer",
          "minimum": 0
        },
        "nbf": {
          "type": "integer",
          "minimum": 0
        },
        "exp": {
          "type": "integer",
          "minimum": 0
        },
        "authVersion": {
          "type": "integer",
          "minimum": 1
        }
      },
      "required": [
        "iss",
        "aud",
        "sub",
        "jti",
        "sid",
        "iat",
        "nbf",
        "exp",
        "authVersion"
      ]
    },
    "sessionRevocation": [
      "logout",
      "disable",
      "password-reset",
      "grant-change"
    ],
    "password": {
      "newMinimumCodePoints": 15,
      "maxUtf8Bytes": 72,
      "transform": "NONE"
    },
    "selfDisable": false,
    "selfGrantChange": false,
    "lastActiveIdentityAdminProtected": true,
    "authorization": {
      "targetRead": "ALL_CURRENT_GRANTS",
      "fullReplacement": "UNION_CURRENT_REQUESTED_GRANTS",
      "lifecycle": "ALL_CURRENT_GRANTS",
      "authoritySource": "RESOURCE_OWNER_PUBLIC_API_FAIL_CLOSED",
      "revocation": "ALL_TARGET_SESSIONS_IN_IDENTITY_TRANSACTION"
    },
    "csrf": {
      "binding": "SERVER_BOUND_PREAUTH_OR_SESSION",
      "authPostOrigin": "EXACT_REQUIRED",
      "challengeGetRotatesRefresh": false,
      "loginLogoutRebind": true,
      "refreshCookie": {
        "hostOnly": true,
        "secure": true,
        "httpOnly": true,
        "sameSite": "Strict",
        "path": "/"
      }
    },
    "reactivation": {
      "previouslyActivated": true,
      "verifiedEmail": true,
      "disabledPendingEligible": false,
      "restoreOldSessions": false
    },
    "preconditions": {
      "malformed": 400,
      "missing": 428,
      "staleNonReplay": 412,
      "businessConflict": 409,
      "authorizedReceiptReplayBeforeStale": true
    },
    "logout": {
      "refreshCookieRequired": false,
      "csrfRequired": true,
      "originRequired": true,
      "missingCookieResult": 204,
      "presentCookieRequiresFamilyBinding": true
    },
    "recovery": {
      "receiptScope": "PREAUTH_BINDING_OPERATION_KEY",
      "requestFingerprintIncludes": [
        "username",
        "email"
      ],
      "receiptForEligibleAndIneligible": true,
      "deliveryAddress": "STORED_VERIFIED_EMAIL_ONLY",
      "submittedEmailMustMatchStored": true,
      "uniformAcceptedResponse": true,
      "receiptStoresPlaintextSecrets": false
    }
  }
