    "/auth/logout": {
      "post": {
        "operationId": "logoutIdentity",
        "tags": [
          "Identity session"
        ],
        "summary": "logout Identity",
        "description": "Validate exact Origin and server-bound CSRF on every request. If refresh cookie is present, validate its family binding and revoke/clear it, including an expired or revoked family. If absent after logout, accept valid pre-auth CSRF and return204 with no extra revocation effect. Rebind fresh pre-auth CSRF and clear residual refresh cookie. Repeated logout never restores a session.",
        "security": [
          {
            "csrfState": []
          }
        ],
        "parameters": [
          {
            "name": "X-Request-Id",
            "in": "header",
            "required": false,
            "description": "Optional safe correlation UUID; invalid input is not echoed.",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "description": "Exact configured browser origin required; missing/null/untrusted denied. No wildcard.",
            "schema": {
              "type": "string",
              "format": "uri"
            }
          },
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "description": "Server-bound challenge AND csrf-state cookie; refresh/logout also session-family binding.",
            "schema": {
              "type": "string",
              "minLength": 32,
              "maxLength": 512
            }
          },
          {
            "name": "__Host-elogistics.refresh",
            "in": "cookie",
            "required": false,
            "description": "Optional after successful logout or expired browser cookie. If present, validate the CSRF-family binding before revocation. If absent, valid server-bound pre-auth CSRF plus exact Origin is still required; return204 and clear any residual cookie. Never restore old sessions.",
            "schema": {
              "type": "string",
              "minLength": 32,
              "maxLength": 512
            }
          }
        ],
        "responses": {
          "204": {
            "description": "Committed; empty body.",
            "headers": {
              "Cache-Control": {
                "description": "Do not cache sensitive responses.",
                "required": true,
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "example": "no-store"
              },
              "X-Request-Id": {
                "description": "Safe correlation UUID.",
                "required": true,
                "schema": {
                  "type": "string",
                  "format": "uuid"
                },
                "example": "10000000-0000-4000-8000-000000000001"
