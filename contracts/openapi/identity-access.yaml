        "operationId": "getIdentityCsrf",
        "tags": [
          "Identity session"
        ],
        "summary": "get Identity Csrf",
        "description": "Issue server-bound challenge and host-only CSRF-state cookie; no refresh rotation or idle extension. Exact configured Origin when supplied; same-origin delivery, no wildcard CORS.",
        "security": [],
        "parameters": [
          {
            "name": "X-Request-Id",
            "in": "header",
            "required": false,
            "description": "Optional safe correlation UUID; invalid input is not echoed.",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful authorized response.",
            "headers": {
              "Cache-Control": {
                "description": "Do not cache sensitive responses.",
                "required": true,
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "example": "no-store"
              },
              "X-Request-Id": {
                "description": "Safe correlation UUID.",
                "required": true,
                "schema": {
                  "type": "string",
                  "format": "uuid"
                },
                "example": "10000000-0000-4000-8000-000000000001"
              },
              "Set-Cookie": {
                "description": "Separate Set-Cookie fields, never comma-fold. __Host-elogistics.csrf plus __Host-elogistics.refresh at login/refresh; logout expires refresh and rebinds CSRF. Every cookie Secure; HttpOnly; SameSite=Strict; Path=/; no Domain. Cap refresh lifetime at absolute deadline.",
                "required": true,
                "schema": {
                  "type": "string"
                },
                "example": "__Host-elogistics.csrf=SYNTHETIC_NON_CREDENTIAL; Path=/; Secure; HttpOnly; SameSite=Strict"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CsrfChallenge"
                }
              }
            }
          },
          "403": {
            "description": "Stable operation errors: ORIGIN_REJECTED. No submitted secrets or object contacts.",
            "headers": {
              "Cache-Control": {
                "description": "Do not cache sensitive responses.",
                "required": true,
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "example": "no-store"
              },
              "X-Request-Id": {
                "description": "Safe correlation UUID.",
                "required": true,
                "schema": {
                  "type": "string",
                  "format": "uuid"
                },
                "example": "10000000-0000-4000-8000-000000000001"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/getIdentityCsrfError403"
                },
                "examples": {
                  "ORIGIN_REJECTED": {
                    "value": {
                      "code": "ORIGIN_REJECTED",
                      "message": "Request could not be completed.",
                      "requestId": "10000000-0000-4000-8000-000000000001"
                    }
                  }
                }
              }
            }
          },
          "429": {
            "description": "Stable operation errors: RATE_LIMITED. No submitted secrets or object contacts.",
            "headers": {
              "Cache-Control": {
                "description": "Do not cache sensitive responses.",
                "required": true,
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "example": "no-store"
              },
              "X-Request-Id": {
                "description": "Safe correlation UUID.",
                "required": true,
                "schema": {
                  "type": "string",
                  "format": "uuid"
                },
                "example": "10000000-0000-4000-8000-000000000001"
              },
              "Retry-After": {
                "description": "Retry seconds.",
                "required": true,
