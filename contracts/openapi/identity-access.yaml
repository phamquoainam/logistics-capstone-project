  "components": {
    "securitySchemes": {
      "productionBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Distinct production issuer/audience/key/session domain and current backend account/session authorization."
      },
      "csrfState": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-elogistics.csrf",
        "description": "HttpOnly server-bound state; browser auth POST also requires CSRF header and exact Origin."
      },
      "refreshCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-elogistics.refresh",
        "description": "Opaque strict rotating token; server hash only; AND csrfState/header/Origin."
      }
    },
    "schemas": {
      "Username": {
        "type": "string",
        "minLength": 1,
        "maxLength": 80,
        "pattern": "\\S",
        "description": "Exact case-sensitive Unicode code-point sequence; no trim, case-fold or normalization. Same validation and identity canonicalization for provisioning/login/recovery. No implicit rewrite/import of Demo-001 identities.",
        "example": "fixture.identity"
      },
      "NewPassword": {
        "type": "string",
        "minLength": 15,
        "maxLength": 72,
        "writeOnly": true,
        "description": "New password: minimum 15 Unicode code points AND maximum 72 UTF-8 bytes, checked before BCrypt; no trim, normalization, truncation or lone surrogate acceptance. JSON Schema maxLength does not prove byte limit.",
        "x-maxUtf8Bytes": 72,
        "example": "Synthetic-only-passphrase-2026"
      },
      "LoginPassword": {
        "type": "string",
        "minLength": 1,
        "maxLength": 72,
        "writeOnly": true,
        "description": "Existing credential verification: at most 72 UTF-8 bytes; do not apply the new-password minimum. Exact input, no transformations.",
        "x-maxUtf8Bytes": 72,
        "example": "legacy"
      },
      "Proof": {
        "type": "string",
